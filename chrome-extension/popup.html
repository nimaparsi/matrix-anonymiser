<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanitise AI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="popup">
      <span class="badge">Privacy First</span>
      <header class="brand"><img src="icons/icon48.png" width="36" height="36" alt="" /><h1>SanitiseAI</h1></header>
      <p class="subtitle">Sanitise sensitive text before sending it to AI.</p>
      <p class="trust">Text is sent to the SanitiseAI API over HTTPS. Review the output before sharing.</p>

      <section class="settings">
        <label class="toggle-row" for="auto-mode-toggle">
          <input id="auto-mode-toggle" type="checkbox" />
          <span>Automatic mode</span>
        </label>
        <p class="setting-note">Intercepts supported form submissions. Some editors use other send controls: use the Sanitise button and review before sending.</p>
      </section>

      <section class="quick-tool">
        <label for="quick-input">Quick sanitise</label>
        <textarea id="quick-input" rows="4" placeholder="Paste text to anonymise..."></textarea>
        <button id="quick-sanitise" class="primary">
          <span class="button-label">Sanitise</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
        <p id="quick-status" class="status" aria-live="polite"></p>
      </section>

      <button id="open-sanitise" class="secondary">Open Sanitise AI</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
